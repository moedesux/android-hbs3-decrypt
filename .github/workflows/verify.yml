name: Verify Android project

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Make Gradle bootstrap executable
        run: chmod +x gradlew
      - name: Run unit tests and Android lint
        run: ./gradlew test lint
